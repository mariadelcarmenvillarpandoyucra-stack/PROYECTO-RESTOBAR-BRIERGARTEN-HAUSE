version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: biergarten_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biergarten
      POSTGRES_USER: biergarten_user
      POSTGRES_PASSWORD: biergarten_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biergarten_user -d biergarten"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: biergarten_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@biergarten.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin-servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: biergarten_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: biergarten
      PGUSER: biergarten_user
      PGPASSWORD: biergarten_pass
      JWT_SECRET: cambia_esta_clave_por_una_larga_y_aleatoria
      JWT_EXPIRES_IN: 12h
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
